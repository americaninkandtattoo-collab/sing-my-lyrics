<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SML — Create</title>
  <link rel="stylesheet" href="app.css" />
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">SML</div>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="create.html" class="nav-link active">Create</a>
      <a href="library.html" class="nav-link">Library</a>
      <a href="trash.html" class="nav-link">Trash</a>
    </nav>

    <div class="sidebar-footer">
      <div class="credits">7,537 Credits</div>
      <div class="ownership">Ownership: 100% You</div>
    </div>
  </aside>

  <!-- CONTENT -->
  <main id="content">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="pill">Create</div>
      <div class="spacer"></div>
      <div class="pill">Workspace</div>
    </header>

    <!-- MAIN -->
    <main class="main">
      <div class="main-wrap" id="createPage">

        <!-- LEFT PANEL -->
        <section class="panel">
          <div class="panel-header">
            <h3>Create a Song</h3>
          </div>

          <div class="panel-body">
            <label>Name your song (optional)</label>
            <input type="text" />

            <label>Lyrics</label>
            <textarea placeholder="Write or paste lyrics here..."></textarea>

            <label>Style</label>
            <textarea placeholder="Describe style (genre, mood, tempo)"></textarea>

            <button class="primary">Create</button>
          </div>
        </section>

        <!-- RIGHT PANEL -->
        <section class="panel">
          <div class="panel-header">
            <h3>Preview</h3>
          </div>

          <div class="panel-body muted">
            No track selected
          </div>
        </section>

      </div>
    </main>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
