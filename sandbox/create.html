<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sandbox – Create</title>

<style>
/* ===== SANDBOX FRAME ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
  font-family: Arial, sans-serif;
  color: #fff;
}

.sandbox-frame {
  display: flex;
  height: 100vh;
}

.sandbox-side {
  flex: 1;
  background: #000;
}

.sandbox-center {
  width: 340px;
  background: #1a1a1a;
  padding: 12px;
  overflow-y: auto;
  box-sizing: border-box;
}

/* ===== CREATE COLUMN ===== */
.create-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.create-row {
  display: flex;
  gap: 6px;
}

.create-btn {
  width: 100%;
  padding: 8px;
  background: #000;
  border: 1px solid #555;
  color: #fff;
  cursor: pointer;
}

.toggle-btn {
  flex: 1;
  padding: 6px;
  background: #111;
  border: 1px solid #444;
  color: #fff;
  text-align: center;
  cursor: pointer;
}

.label {
  font-size: 13px;
  font-weight: bold;
}

/* Inputs */
input,
textarea {
  width: 100%;
  box-sizing: border-box;
  background: #181818;
  border: 1px solid #333;
  color: #fff;
  padding: 6px;
  font-size: 13px;
}

/* Lyrics */
textarea {
  height: 160px;
  resize: none;
  overflow-y: auto;
  overflow-x: hidden;
}

.style-input {
  height: 48px;
  resize: none;
  overflow-y: auto;
  overflow-x: hidden;
}

.style-presets {
  max-height: 90px;
  overflow-y: auto;
  overflow-x: hidden;
  background: #181818;
  border: 1px solid #333;
  font-size: 12px;
}

.style-presets div {
  padding: 4px;
  cursor: pointer;
}

.style-presets div:hover {
  background: #2a2a2a;
}

.advanced {
  background: #151515;
  border: 1px solid #333;
  padding: 8px;
}

.adv-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.adv-row input {
  width: 60px;
  text-align: right;
}
</style>
</head>

<body>

<div class="sandbox-frame">
  <div class="sandbox-side"></div>

  <div class="sandbox-center">

    <div class="create-section">
      <button class="create-btn">Create Song</button>
    </div>

    <div class="create-section">
      <button class="create-btn">Record Audio</button>
    </div>

    <!-- CADENCE CONTROLS (SURGICAL ADD) -->
    <div class="create-section">
      <div class="create-row">
        <button id="cadenceBtn" class="toggle-btn">Cadence: Original</button>
        <button id="resetCadenceBtn" class="toggle-btn">Reset Cadence</button>
      </div>
    </div>

    <div class="create-section">
      <button class="toggle-btn">Spell + Punctuation Check</button>
    </div>

    <div class="create-section">
      <div class="label">Lyrics</div>
      <textarea id="lyricsBox" placeholder="Enter lyrics here..."></textarea>
    </div>

    <div class="create-section">
      <input placeholder="Add Song Title" />
    </div>

    <div class="create-section">
      <div class="label">Styles</div>
      <textarea id="styleInput" class="style-input" placeholder="Type custom styles…"></textarea>

      <div class="style-presets" id="stylePresets">
        <div>Hardcore Punk</div>
        <div>Industrial</div>
        <div>Lo-Fi</div>
        <div>Hip-Hop</div>
        <div>Electronic</div>
        <div>Experimental</div>
        <div>Post-Punk</div>
        <div>Noise Rock</div>
        <div>Synthwave</div>
        <div>Darkwave</div>
        <div>Grunge</div>
        <div>Alt-Rock</div>
        <div>Trap</div>
        <div>Boom Bap</div>
        <div>Ambient</div>
        <div>Drone</div>
        <div>Industrial Metal</div>
        <div>Hard Techno</div>
        <div>Minimal</div>
        <div>Spoken Word</div>
      </div>
    </div>

    <div class="create-section advanced">
      <div class="label">Advanced Options</div>

      <div class="adv-row">
        <span>Craziness</span>
        <input type="number" min="0" max="99" value="0" />
      </div>

      <div class="adv-row">
        <span>Style Influence</span>
        <input type="number" min="0" max="99" value="0" />
      </div>

      <div class="adv-row">
        <span>Audio Influence</span>
        <input type="number" min="0" max="99" value="0" />
      </div>
    </div>

    <div class="create-section">
      <button class="create-btn">Create Song</button>
    </div>

  </div>

  <div class="sandbox-side"></div>
</div>

<script>
/* STYLE PRESET → INPUT (UNCHANGED) */
const styleInput = document.getElementById('styleInput');
document.getElementById('stylePresets').addEventListener('click', e => {
  if (!e.target || !e.target.textContent) return;
  const style = e.target.textContent;
  const existing = styleInput.value.split(',').map(s => s.trim()).filter(Boolean);
  if (!existing.includes(style)) {
    existing.push(style);
    styleInput.value = existing.join(', ');
  }
});

/* ===== CADENCE LOGIC (SURGICAL ADD) ===== */
const lyricsBox = document.getElementById('lyricsBox');
const cadenceBtn = document.getElementById('cadenceBtn');
const resetBtn = document.getElementById('resetCadenceBtn');

let originalLyrics = '';
let cadenceIndex = 0;

const cadences = [
  text => text, // Original
  text => text.split('\n').map(l => l.trim()).join('\n'), // Tight
  text => text.split(' ').join(' / '), // Chopped
  text => text.split('\n').join('\n\n'), // Spaced
  text => text.split('').join(' ') // Staccato
];

const cadenceLabels = [
  'Original',
  'Cadence 1',
  'Cadence 2',
  'Cadence 3',
  'Cadence 4'
];

cadenceBtn.onclick = () => {
  if (!originalLyrics) originalLyrics = lyricsBox.value;
  cadenceIndex = (cadenceIndex + 1) % cadences.length;
  lyricsBox.value = cadences[cadenceIndex](originalLyrics);
  cadenceBtn.textContent = Cadence: ${cadenceLabels[cadenceIndex]};
};

resetBtn.onclick = () => {
  lyricsBox.value = originalLyrics;
  cadenceIndex = 0;
  cadenceBtn.textContent = 'Cadence: Original';
};
</script>

</body>
</html>
