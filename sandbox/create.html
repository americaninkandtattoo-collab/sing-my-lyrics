<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sandbox – Create</title>

<style>
/* ===== SANDBOX FRAME ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
  font-family: Arial, sans-serif;
  color: #fff;
}

.sandbox-frame {
  display: flex;
  height: 100vh;
}

.sandbox-side {
  flex: 1;
  background: #000;
}

.sandbox-center {
  width: 340px;
  background: #1a1a1a;
  padding: 12px;
  overflow-y: auto;
  box-sizing: border-box;
}

/* ===== CREATE COLUMN ===== */
.create-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.create-row {
  display: flex;
  gap: 6px;
}

.create-btn {
  width: 100%;
  padding: 8px;
  background: #000;
  border: 1px solid #555;
  color: #fff;
  cursor: pointer;
}

.toggle-btn {
  flex: 1;
  padding: 6px;
  background: #111;
  border: 1px solid #444;
  color: #fff;
  text-align: center;
  cursor: pointer;
}

.label {
  font-size: 13px;
  font-weight: bold;
}

/* Inputs */
input,
textarea {
  width: 100%;
  box-sizing: border-box;
  background: #181818;
  border: 1px solid #333;
  color: #fff;
  padding: 6px;
  font-size: 13px;
}

/* Auto-expand base */
textarea {
  resize: none;
  overflow: hidden;
}

.style-input {
  resize: none;
  overflow: hidden;
}

.style-presets {
  max-height: 90px;
  overflow-y: auto;
  overflow-x: hidden;
  background: #181818;
  border: 1px solid #333;
  font-size: 12px;
}

.style-presets div {
  padding: 4px;
  cursor: pointer;
}

.style-presets div:hover {
  background: #2a2a2a;
}

.advanced {
  background: #151515;
  border: 1px solid #333;
  padding: 8px;
}

.adv-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.adv-row input {
  width: 60px;
  text-align: right;
}
</style>
</head>

<body>

<div class="sandbox-frame">
  <div class="sandbox-side"></div>

  <div class="sandbox-center">

    <div class="create-section">
      <button class="create-btn">Create Song</button>
    </div>

    <div class="create-section">
      <button class="create-btn">Record Audio</button>
    </div>

    <!-- CADENCE CONTROLS -->
    <div class="create-section">
      <div class="create-row">
        <button type="button" id="cadenceBtn" class="toggle-btn">Cadence: Original</button>
        <button type="button" id="resetCadenceBtn" class="toggle-btn">Reset Cadence</button>
      </div>
    </div>

    <!-- SPELL CHECK (NATIVE) -->
    <div class="create-section">
      <button type="button" id="spellBtn" class="toggle-btn">Spell + Punctuation Check</button>
    </div>

    <div class="create-section">
      <div class="label">Lyrics</div>
      <textarea
        id="lyricsBox"
        placeholder="Enter lyrics here..."
        spellcheck="true"
      ></textarea>
    </div>

    <div class="create-section">
      <input placeholder="Add Song Title" />
    </div>

    <div class="create-section">
      <div class="label">Styles</div>
      <textarea
        id="styleInput"
        class="style-input"
        placeholder="Type custom styles…"
        spellcheck="true"
      ></textarea>

      <div class="style-presets" id="stylePresets">
        <div>Hardcore Punk</div>
        <div>Industrial</div>
        <div>Lo-Fi</div>
        <div>Hip-Hop</div>
        <div>Electronic</div>
        <div>Experimental</div>
        <div>Post-Punk</div>
        <div>Noise Rock</div>
        <div>Synthwave</div>
        <div>Darkwave</div>
        <div>Grunge</div>
        <div>Alt-Rock</div>
        <div>Trap</div>
        <div>Boom Bap</div>
        <div>Ambient</div>
        <div>Drone</div>
        <div>Industrial Metal</div>
        <div>Hard Techno</div>
        <div>Minimal</div>
        <div>Spoken Word</div>
      </div>
    </div>

    <div class="create-section advanced">
      <div class="label">Advanced Options</div>

      <div class="adv-row">
        <span>Craziness</span>
        <input type="number" min="0" max="99" value="0" />
      </div>

      <div class="adv-row">
        <span>Style Influence</span>
        <input type="number" min="0" max="99" value="0" />
      </div>

      <div class="adv-row">
        <span>Audio Influence</span>
        <input type="number" min="0" max="99" value="0" />
      </div>
    </div>

    <div class="create-section">
      <button class="create-btn">Create Song</button>
    </div>

  </div>

  <div class="sandbox-side"></div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {

  /* ===== AUTO-EXPAND ===== */
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  const lyricsBox = document.getElementById('lyricsBox');
  const styleInput = document.getElementById('styleInput');

  [lyricsBox, styleInput].forEach(el => {
    autoResize(el);
    el.addEventListener('input', () => autoResize(el));
  });

  /* STYLE PRESET → INPUT (UNCHANGED) */
  document.getElementById('stylePresets').addEventListener('click', e => {
    if (!e.target || !e.target.textContent) return;
    const style = e.target.textContent;
    const existing = styleInput.value.split(',').map(s => s.trim()).filter(Boolean);
    if (!existing.includes(style)) {
      existing.push(style);
      styleInput.value = existing.join(', ');
      autoResize(styleInput);
    }
  });

  /* CADENCE LOGIC (UNCHANGED) */
  const cadenceBtn = document.getElementById('cadenceBtn');
  const resetCadenceBtn = document.getElementById('resetCadenceBtn');

  let cadenceIndex = 0;
  let originalLyrics = "";

  function cadence1(t){return t.split(/\s+/).filter(Boolean).join(" / ");}
  function cadence2(t){return t.split(/\s+/).filter(Boolean).join("\n");}
  function cadence3(t){return t.split("\n").map(l=>l.split(/\s+/).filter(Boolean).join("  ")).join("\n");}
  function cadence4(t){return t.split(/\s+/).filter(Boolean).map(w=>w+"…").join(" ");}

  const cadenceFns = [cadence1,cadence2,cadence3,cadence4];
  const cadenceNames = ["Chop","Staccato","Double Space","Trailing Echo"];

  function captureOriginal() {
    if (!originalLyrics) originalLyrics = lyricsBox.value;
  }

  cadenceBtn.addEventListener('click', () => {
    captureOriginal();
    cadenceIndex = (cadenceIndex % 4) + 1;
    lyricsBox.value = cadenceFns[cadenceIndex - 1](originalLyrics);
    cadenceBtn.textContent = "Cadence: " + cadenceNames[cadenceIndex - 1];
    autoResize(lyricsBox);
  });

  resetCadenceBtn.addEventListener('click', () => {
    lyricsBox.value = originalLyrics || "";
    cadenceIndex = 0;
    cadenceBtn.textContent = "Cadence: Original";
    autoResize(lyricsBox);
  });

  /* SPELL BUTTON — FOCUS ONLY (REAL SPELLCHECK) */
  document.getElementById('spellBtn').addEventListener('click', () => {
    lyricsBox.focus();
  });

});
</script>

</body>
</html>
