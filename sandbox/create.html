<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sandbox – Create</title>

<style>
/* ===== SANDBOX FRAME ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
  font-family: Arial, sans-serif;
  color: #fff;
}

.sandbox-frame {
  display: flex;
  height: 100vh;
}

.sandbox-side {
  flex: 1;
  background: #000;
}

.sandbox-center {
  width: 340px;
  background: #1a1a1a;
  padding: 12px;
  overflow-y: auto;
  box-sizing: border-box;
}

/* ===== CREATE COLUMN ===== */
.create-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.create-row {
  display: flex;
  gap: 6px;
}

.create-btn {
  width: 100%;
  padding: 8px;
  background: #000;
  border: 1px solid #555;
  color: #fff;
  cursor: pointer;
}

.toggle-btn {
  flex: 1;
  padding: 6px;
  background: #111;
  border: 1px solid #444;
  color: #fff;
  text-align: center;
  cursor: pointer;
}

.label {
  font-size: 13px;
  font-weight: bold;
}

/* Inputs */
input,
textarea {
  width: 100%;
  box-sizing: border-box;
  background: #181818;
  border: 1px solid #333;
  color: #fff;
  padding: 6px;
  font-size: 13px;
}

/* Auto-expand */
textarea {
  resize: none;
  overflow: hidden;
}

.style-input {
  resize: none;
  overflow: hidden;
}

.style-presets {
  max-height: 90px;
  overflow-y: auto;
  background: #181818;
  border: 1px solid #333;
  font-size: 12px;
}

.style-presets div {
  padding: 4px;
  cursor: pointer;
}

.style-presets div:hover {
  background: #2a2a2a;
}
</style>
</head>

<body>

<div class="sandbox-frame">
  <div class="sandbox-side"></div>

  <div class="sandbox-center">

    <div class="create-section">
      <button class="create-btn">Create Song</button>
    </div>

    <div class="create-section">
      <button class="create-btn">Record Audio</button>
    </div>

    <div class="create-section">
      <div class="create-row">
        <button type="button" id="cadenceBtn" class="toggle-btn">Cadence: Original</button>
        <button type="button" id="resetCadenceBtn" class="toggle-btn">Reset Cadence</button>
      </div>
    </div>

    <div class="create-section">
      <button id="spellBtn" type="button" class="toggle-btn">Spell + Punctuation Check</button>
    </div>

    <div class="create-section">
      <div class="label">Lyrics</div>
      <textarea id="lyricsBox" placeholder="Enter lyrics here..."></textarea>
    </div>

    <div class="create-section">
      <input placeholder="Add Song Title" />
    </div>

    <div class="create-section">
      <div class="label">Styles</div>
      <textarea id="styleInput" class="style-input" placeholder="Type custom styles…"></textarea>
      <div class="style-presets" id="stylePresets">
        <div>Hardcore Punk</div>
        <div>Industrial</div>
        <div>Lo-Fi</div>
        <div>Hip-Hop</div>
        <div>Electronic</div>
        <div>Experimental</div>
      </div>
    </div>

  </div>

  <div class="sandbox-side"></div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {

  const lyricsBox = document.getElementById('lyricsBox');
  const cadenceBtn = document.getElementById('cadenceBtn');
  const resetCadenceBtn = document.getElementById('resetCadenceBtn');
  const spellBtn = document.getElementById('spellBtn');
  const styleInput = document.getElementById('styleInput');

  let cadenceIndex = 0;
  let baseText = "";

  const cadenceFns = [
    t => t.split(/\s+/).join(" / "),
    t => t.split(/\s+/).join("\n"),
    t => t.split("\n").map(l => l.split(/\s+/).join("  ")).join("\n"),
    t => t.split(/\s+/).map(w => w + "…").join(" ")
  ];

  const cadenceNames = ["Chop", "Staccato", "Double Space", "Trailing Echo"];

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  lyricsBox.addEventListener('input', () => {
    baseText = lyricsBox.value;
    cadenceIndex = 0;
    cadenceBtn.textContent = "Cadence: Original";
    autoResize(lyricsBox);
  });

  cadenceBtn.addEventListener('click', () => {
    if (!baseText) return;
    cadenceIndex = (cadenceIndex % 4) + 1;
    lyricsBox.value = cadenceFns[cadenceIndex - 1](baseText);
    cadenceBtn.textContent = "Cadence: " + cadenceNames[cadenceIndex - 1];
    autoResize(lyricsBox);
  });

  resetCadenceBtn.addEventListener('click', () => {
    lyricsBox.value = baseText;
    cadenceIndex = 0;
    cadenceBtn.textContent = "Cadence: Original";
    autoResize(lyricsBox);
  });

  /* REAL spell + punctuation — backend required */
  spellBtn.addEventListener('click', async () => {
    if (!lyricsBox.value.trim()) return;

    const response = await fetch('/api/spellcheck', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: lyricsBox.value })
    });

    const data = await response.json();
    baseText = data.correctedText;
    lyricsBox.value = baseText;
    cadenceIndex = 0;
    cadenceBtn.textContent = "Cadence: Original";
    autoResize(lyricsBox);
  });

});
</script>

</body>
</html>
