<!-- CREATE SONG (TOP) -->
<div class="create-section">
  <button class="create-btn">Create Song</button>
</div>

<!-- RECORD AUDIO -->
<div class="create-section">
  <button class="create-btn">Record Audio</button>
</div>

<!-- CADENCE TOGGLE -->
<div class="create-section">
  <button class="toggle-btn">Cadence</button>
</div>

<!-- SPELL CHECK TOGGLE -->
<div class="create-section">
  <button class="toggle-btn">Spell + Punctuation Check</button>
</div>

<!-- LYRICS -->
<div class="create-section">
  <div class="create-title">Lyrics</div>
  <textarea
    rows="8"
    wrap="soft"
    placeholder="Enter lyrics here..."
    style="width:100%; max-height:160px; overflow-y:auto; overflow-x:hidden;"
  ></textarea>
</div>

<!-- SONG TITLE -->
<div class="create-section">
  <input
    type="text"
    placeholder="Add Song Title"
    style="width:100%; box-sizing:border-box;"
  />
</div>

<!-- STYLES -->
<div class="create-section">
  <div class="create-title">Styles</div>

  <!-- CUSTOM STYLE INPUT -->
  <textarea
    rows="2"
    wrap="soft"
    placeholder="Type custom styles…"
    style="width:100%; max-height:60px; overflow-y:auto; overflow-x:hidden;"
  ></textarea>

  <!-- PRESET STYLES -->
  <div class="style-presets">
    <div>Hardcore Punk</div>
    <div>Industrial</div>
    <div>Lo-Fi</div>
    <div>Hip-Hop</div>
    <div>Electronic</div>
    <div>Experimental</div>
  </div>
</div>

<!-- ADVANCED OPTIONS -->
<div class="create-section advanced">
  <div class="create-title">Advanced Options</div>

  <div class="adv-row">
    <span>Craziness</span>
    <input type="number" value="0" />
  </div>

  <div class="adv-row">
    <span>Style Influence</span>
    <input type="number" value="0" />
  </div>

  <div class="adv-row">
    <span>Audio Influence</span>
    <input type="number" value="0" />
  </div>
</div>

<!-- CREATE SONG (BOTTOM) -->
<div class="create-section">
  <button class="create-btn">Create Song</button>
</div>
