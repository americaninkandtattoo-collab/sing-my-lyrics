<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Sandbox Layout</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* APP GRID — UNCHANGED */
.app {
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  grid-template-rows: 1fr 80px;
  height: 100vh;
  width: 100vw;
}

/* PANELS — UNCHANGED */
.left {
  grid-column: 1;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-right: 2px solid #555;
  overflow-y: auto;
  padding: 10px;
}

.center {
  grid-column: 2;
  grid-row: 1;
  background: #222;
  padding: 10px;
  overflow: hidden;
}

.right {
  grid-column: 3;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-left: 2px solid #555;
  overflow-y: auto;
  padding: 10px;
}

/* PLAYER — UNCHANGED */
.player {
  grid-column: 2;
  grid-row: 2;
  background: #0d0d0d;
  border-top: 2px solid #555;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
}

/* LEFT PANEL — UNCHANGED */
.left-header { display:flex; gap:8px; margin-bottom:16px; }
.left-header .logo { font-weight:bold; }
.left-nav { display:flex; flex-direction:column; gap:12px; }
.left-item { display:flex; gap:10px; cursor:pointer; }

/* PLAYER CONTROLS — UNCHANGED */
.player-controls { display:flex; gap:10px; }
.player-timeline { flex:1; display:flex; align-items:center; gap:8px; }
.player-bar { flex:1; height:4px; background:#333; }

/* RIGHT PANEL — UNCHANGED INTERNAL */
.right-panel-stack { display:flex; flex-direction:column; gap:12px; }
.right-image { height:160px; background:#2a2a2a; display:flex; align-items:center; justify-content:center; }
.right-lyrics { flex:1; background:#181818; padding:8px; overflow-y:auto; }

/* ============================== */
/* CENTER PANEL — CREATE + WORKSPACE */
/* ============================== */

.center-shell {
  display: flex;
  height: 100%;
  gap: 12px;
}

/* CREATE COLUMN */
.center-create {
  width: 340px;
  background: #1a1a1a;
  border-right: 1px solid #444;
  padding: 12px;
  overflow-y: auto;
}

.create-section {
  margin-bottom: 14px;
}

.create-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.create-btn {
  width: 100%;
  padding: 8px;
  background: #000;
  border: 1px solid #555;
  color: #fff;
  cursor: pointer;
}

.toggle-btn {
  width: 100%;
  padding: 6px;
  background: #111;
  border: 1px solid #444;
  text-align: left;
  cursor: pointer;
}

textarea {
  width: 100%;
  height: 140px;
  background: #181818;
  border: 1px solid #333;
  color: #fff;
  padding: 8px;
  resize: none;
}

input {
  width: 100%;
  padding: 6px;
  background: #181818;
  border: 1px solid #333;
  color: #fff;
}

.scroll-box {
  height: 80px;
  background: #181818;
  border: 1px solid #333;
  overflow-y: auto;
  padding: 6px;
  font-size: 12px;
}

.advanced {
  border: 1px solid #333;
  padding: 8px;
  background: #151515;
}

/* WORKSPACE */
.center-workspace {
  flex: 1;
  background: #202020;
  border: 1px solid #333;
  padding: 12px;
}
</style>
</head>

<body>

<div class="app">

  <!-- LEFT PANEL -->
  <div class="left">
    <div class="left-header"><div class="logo">SML</div></div>
    <div class="left-nav">
      <div class="left-item">User</div>
      <div class="left-item">Home</div>
      <div class="left-item">Create</div>
      <div class="left-item">Library</div>
      <div class="left-item">Search</div>
      <div class="left-item">Trash</div>
      <div class="left-item">Credits</div>
    </div>
  </div>

  <!-- CENTER PANEL -->
  <div class="center">
    <div class="center-shell">

      <!-- CREATE -->
      <div class="center-create">

        <div class="create-section">
          <button class="create-btn">Create Song</button>
        </div>

        <div class="create-section">
          <button class="create-btn">Record Audio</button>
        </div>

        <div class="create-section">
          <button class="toggle-btn">Cadence</button>
        </div>

        <div class="create-section">
          <button class="toggle-btn">Spell + Punctuation Check</button>
        </div>

        <div class="create-section">
          <div class="create-title">Lyrics</div>
          <textarea placeholder="Enter lyrics here..."></textarea>
        </div>

        <div class="create-section">
          <input placeholder="Add Song Title" />
        </div>

        <div class="create-section">
          <div class="create-title">Styles</div>
          <div class="scroll-box">Scrollable styles list</div>
        </div>

        <div class="create-section advanced">
          <div class="create-title">Advanced Options</div>
          <input placeholder="Enter styles to exclude" />
          <input placeholder="Craziness %" />
          <input placeholder="Style Influence %" />
          <input placeholder="Audio Influence %" />
        </div>

        <div class="create-section">
          <button class="create-btn">Create Song</button>
        </div>

      </div>

      <!-- WORKSPACE -->
      <div class="center-workspace">
        Workspace reserved
      </div>

    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <div class="right-panel-stack">
      <div class="right-image">Generated Image</div>
      <div>User info</div>
      <div>Song Title</div>
      <div class="right-lyrics">Lyrics preview</div>
      <div>Date created</div>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="player">
    <div class="player-controls">▶️ ⏭ ⏮</div>
    <div class="player-timeline">
      <div>0:00</div>
      <div class="player-bar"></div>
      <div>3:30</div>
    </div>
  </div>

</div>

</body>
</html>
