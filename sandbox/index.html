<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SML Lite</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* ===== APP GRID ===== */
.app {
  display: grid;
  grid-template-columns: 220px 1fr 260px;
  grid-template-rows: 1fr 80px;
  height: 100vh;
  transition: grid-template-columns 0.25s ease;
}

.app.left-collapsed {
  grid-template-columns: 40px 1fr 260px;
}

/* ===== LEFT PANEL ===== */
.left {
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-right: 2px solid #555;
  padding: 10px;
}

.left .label {
  white-space: nowrap;
}

.app.left-collapsed .label {
  display: none;
}

.toggle-btn {
  width: 100%;
  background: #000;
  border: 1px solid #555;
  color: #fff;
  cursor: pointer;
  margin-bottom: 12px;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.nav-item {
  display: flex;
  gap: 10px;
  cursor: pointer;
}

/* ===== CENTER (CREATE) ===== */
.center {
  grid-column: 2;
  grid-row: 1;
  background: #222;
  padding: 12px;
  overflow-y: auto;
}

.create {
  max-width: 360px;
}

/* inputs */
input, textarea {
  width: 100%;
  background: #181818;
  border: 1px solid #333;
  color: #fff;
  padding: 6px;
  font-size: 13px;
}

textarea {
  resize: none;
}

.section {
  margin-bottom: 14px;
}

.row {
  display: flex;
  gap: 6px;
}

.btn {
  width: 100%;
  padding: 8px;
  background: #000;
  border: 1px solid #555;
  color: #fff;
  cursor: pointer;
}

.toggle {
  flex: 1;
  padding: 6px;
  background: #111;
  border: 1px solid #444;
  color: #fff;
  cursor: pointer;
}

.advanced {
  background: #151515;
  border: 1px solid #333;
  padding: 8px;
}

.adv-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.adv-input {
  width: 60px;
  text-align: right;
}

/* ===== RIGHT PANEL (SONG CARD) ===== */
.right {
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-left: 2px solid #555;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cover {
  height: 160px;
  background: #2a2a2a;
  border: 1px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
}

.song-info {
  font-size: 13px;
  font-weight: bold;
}

.lyrics {
  flex: 1;
  background: #181818;
  border: 1px solid #333;
  padding: 8px;
  overflow-y: auto;
  font-size: 13px;
}

/* ===== PLAYER ===== */
.player {
  grid-column: 2;
  grid-row: 2;
  background: #0d0d0d;
  border-top: 2px solid #555;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
}

.bar {
  flex: 1;
  height: 4px;
  background: #333;
}

.fill {
  width: 25%;
  height: 100%;
  background: #fff;
}
</style>
</head>

<body>

<div class="app" id="app">

  <!-- LEFT -->
  <div class="left">
    <button class="toggle-btn" onclick="toggleLeft()">❮</button>

    <div class="nav">
      <div class="nav-item">👤 <span class="label">User</span></div>
      <div class="nav-item">🏠 <span class="label">Home</span></div>
      <div class="nav-item">✱ <span class="label">Create</span></div>
      <div class="nav-item">📁 <span class="label">Library</span></div>
      <div class="nav-item">🗑 <span class="label">Trash</span></div>
    </div>
  </div>

  <!-- CENTER CREATE -->
  <div class="center">
    <div class="create">

      <div class="section">
        <button class="btn">Create Song</button>
      </div>

      <div class="section row">
        <button class="toggle">Cadence</button>
        <button class="toggle">Reset</button>
      </div>

      <div class="section">
        <textarea placeholder="Lyrics..."></textarea>
      </div>

      <div class="section">
        <input placeholder="Song title">
      </div>

      <div class="section advanced">
        <div class="adv-row">
          <span>Craziness</span>
          <input class="adv-input" value="50%">
        </div>
        <div class="adv-row">
          <span>Style Influence</span>
          <input class="adv-input" value="50%">
        </div>
        <div class="adv-row">
          <span>Audio Influence</span>
          <input class="adv-input" value="50%">
        </div>
      </div>

      <div class="section">
        <button class="btn">Generate</button>
      </div>

    </div>
  </div>

  <!-- RIGHT SONG -->
  <div class="right">
    <div class="cover">Artwork</div>
    <div class="song-info">Song Title</div>
    <div class="lyrics">Lyrics preview…</div>
  </div>

  <!-- PLAYER -->
  <div class="player">
    ▶
    <div class="bar"><div class="fill"></div></div>
    0:00
  </div>

</div>

<script>
function toggleLeft() {
  document.getElementById('app').classList.toggle('left-collapsed');
}
</script>

</body>
</html>
