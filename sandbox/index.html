<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Sandbox Layout</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* APP GRID */
.app {
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  grid-template-rows: 1fr 80px;
  height: 100vh;
  width: 100vw;
  transition: grid-template-columns 0.25s ease;
}

/* PANELS */
.left {
  grid-column: 1;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-right: 2px solid #555;
  overflow-y: auto;
  padding: 10px;
}

.center {
  grid-column: 2;
  grid-row: 1;
  background: #222;
  overflow-y: auto;
  padding: 10px;
}

.right {
  grid-column: 3;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-left: 2px solid #555;
  overflow-y: auto;
  padding: 10px;
}

/* BOTTOM PLAYER — CENTER ONLY */
.player {
  grid-column: 2;
  grid-row: 2;
  background: #000;
  border-top: 2px solid #555;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* COLLAPSE STATES */
.app.left-collapsed {
  grid-template-columns: 40px 1fr 220px;
}

.app.right-collapsed {
  grid-template-columns: 220px 1fr 40px;
}

/* BUTTONS */
.toggle-btn {
  background: #000;
  color: #fff;
  border: 1px solid #555;
  cursor: pointer;
  padding: 4px 6px;
  margin-bottom: 10px;
  font-size: 14px;
}

/* DEBUG CONTENT */
.block {
  height: 1200px;
  border: 1px dashed #444;
}
</style>
</head>

<body>

<div class="app" id="app">

  <div class="left">
    <button class="toggle-btn" onclick="toggleLeft()">❮</button>
    LEFT PANEL
    <div class="block"></div>
  </div>

  <div class="center">
    CENTER PANEL
    <div class="block"></div>
  </div>

  <div class="right">
    <button class="toggle-btn" onclick="toggleRight()">❯</button>
    RIGHT PANEL
    <div class="block"></div>
  </div>

  <div class="player">
    BOTTOM PLAYER BAR
  </div>

</div>

<script>
function toggleLeft() {
  document.getElementById('app').classList.toggle('left-collapsed');
}

function toggleRight() {
  document.getElementById('app').classList.toggle('right-collapsed');
}
</script>

</body>
</html>
