<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SML Lite — One-Click Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f1116;
  --panel:#151a22;
  --panel2:#10141b;
  --line:#2a3546;
  --text:#e8eefc;
  --muted:#a8b3c7;
  --accent:#2aa8ff;
  --danger:#ff5b5b;
  --ok:#2bd46a;
  --radius:16px;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui, sans-serif;
}

.app{
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:14px;
}

.logo{
  font-weight:800;
  font-size:18px;
  margin-bottom:12px;
}

.nav a{
  display:block;
  padding:10px;
  border-radius:10px;
  color:var(--text);
  text-decoration:none;
  margin-bottom:6px;
}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.active{background:rgba(42,168,255,.15)}

.footer{
  font-size:12px;
  color:var(--muted);
  margin-top:20px;
}

/* MAIN */
.main{
  padding:20px;
}

.card{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
}

h2{margin-top:0}

input,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0003;
  color:var(--text);
}

textarea{min-height:160px}

button{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0005;
  color:var(--text);
  cursor:pointer;
  font-weight:600;
}
button:hover{background:#0008}

.primary{background:var(--accent);border:none}
.danger{background:rgba(255,91,91,.2)}
.ok{background:rgba(43,212,106,.2)}

.list{display:flex;flex-direction:column;gap:10px}

.song{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  background:#0004;
}
.song small{color:var(--muted)}

.hidden{display:none}
</style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">SML Lite</div>

    <nav class="nav">
      <a href="#profile">Profile</a>
      <a href="#home" class="active">Home</a>
      <a href="#create">Create</a>
      <a href="#library">Library</a>
      <a href="#trash">Trash</a>
    </nav>

    <div class="footer">
      Front-end only<br>
      You own your lyrics
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HOME -->
    <section id="home" class="card">
      <h2>Making rock stars — one human at a time.</h2>
      <p class="muted">
        This is a one-click, honest SML Lite.<br>
        Nothing runs unless you click it.
      </p>
      <button onclick="go('create')" class="primary">Go to Create</button>
    </section>

    <!-- CREATE -->
    <section id="create" class="card hidden">
      <h2>Create</h2>

      <input id="title" placeholder="Song title (optional)">
      <br><br>

      <textarea id="lyrics" placeholder="Paste lyrics here (required)"></textarea>
      <br><br>

      <textarea id="style" placeholder="Style / vibe (optional)"></textarea>
      <br><br>

      <button class="primary" onclick="saveSong()">One-Click Save</button>
      <button onclick="clearFields()">Clear</button>
    </section>

    <!-- LIBRARY -->
    <section id="library" class="card hidden">
      <h2>Library</h2>
      <div id="libraryList" class="list"></div>
    </section>

    <!-- TRASH -->
    <section id="trash" class="card hidden">
      <h2>Trash</h2>
      <div id="trashList" class="list"></div>
    </section>

    <!-- PROFILE -->
    <section id="profile" class="card hidden">
      <h2>Profile</h2>
      <input id="profileName" placeholder="Display name">
      <br><br>
      <button class="ok" onclick="saveProfile()">Save</button>
    </section>

  </main>
</div>

<script>
const LIB='sml_lib';
const TRASH='sml_trash';
const PROFILE='sml_profile';

let lib=JSON.parse(localStorage.getItem(LIB)||'[]');
let trash=JSON.parse(localStorage.getItem(TRASH)||'[]');

function go(id){
  document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));
  document.querySelector(.nav a[href="#${id}"]).classList.add('active');
  if(id==='library') renderLibrary();
  if(id==='trash') renderTrash();
}

function saveSong(){
  if(!lyrics.value.trim()) return alert('Lyrics required');
  lib.unshift({
    id:Date.now(),
    title:title.value||'Untitled',
    lyrics:lyrics.value,
    style:style.value
  });
  localStorage.setItem(LIB,JSON.stringify(lib));
  clearFields();
  go('library');
}

function clearFields(){
  title.value='';
  lyrics.value='';
  style.value='';
}

function renderLibrary(){
  libraryList.innerHTML='';
  if(!lib.length){libraryList.innerHTML='<small>No songs yet</small>';return;}
  lib.forEach(s=>{
    const d=document.createElement('div');
    d.className='song';
    d.innerHTML=`
      <b>${s.title}</b><br>
      <small>${s.style||''}</small><br><br>
      <button onclick="trashSong(${s.id})" class="danger">Delete</button>
    `;
    d.oncontextmenu=e=>{
      e.preventDefault();
      navigator.clipboard.writeText(s.lyrics);
      alert('Lyrics copied (right-click)');
    };
    libraryList.appendChild(d);
  });
}

function renderTrash(){
  trashList.innerHTML='';
  if(!trash.length){trashList.innerHTML='<small>Trash empty</small>';return;}
  trash.forEach(s=>{
    const d=document.createElement('div');
    d.className='song';
    d.innerHTML=`
      <b>${s.title}</b><br><br>
      <button onclick="restore(${s.id})" class="ok">Restore</button>
    `;
    trashList.appendChild(d);
  });
}

function trashSong(id){
  const i=lib.findIndex(s=>s.id===id);
  trash.unshift(lib.splice(i,1)[0]);
  localStorage.setItem(LIB,JSON.stringify(lib));
  localStorage.setItem(TRASH,JSON.stringify(trash));
  renderLibrary();
}

function restore(id){
  const i=trash.findIndex(s=>s.id===id);
  lib.unshift(trash.splice(i,1)[0]);
  localStorage.setItem(LIB,JSON.stringify(lib));
  localStorage.setItem(TRASH,JSON.stringify(trash));
  renderTrash();
}

function saveProfile(){
  localStorage.setItem(PROFILE,profileName.value);
  alert('Profile saved');
}

go('home');
</script>
</body>
</html>
