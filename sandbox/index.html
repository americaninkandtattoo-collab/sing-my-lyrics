<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Sandbox Layout</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* APP GRID — UNCHANGED */
.app {
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  grid-template-rows: 1fr 80px;
  height: 100vh;
  width: 100vw;
  transition: grid-template-columns 0.25s ease;
}

/* PANELS — UNCHANGED */
.left {
  grid-column: 1;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-right: 2px solid #555;
  overflow-y: auto;
  padding: 10px;
}

.center {
  grid-column: 2;
  grid-row: 1;
  background: #222;
  overflow-y: auto;
  padding: 10px;
}

.right {
  grid-column: 3;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-left: 2px solid #555;
  overflow-y: auto;
  padding: 10px;
}

/* BOTTOM PLAYER — UNCHANGED */
.player {
  grid-column: 2;
  grid-row: 2;
  background: #000;
  border-top: 2px solid #555;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* COLLAPSE STATES — UNCHANGED */
.app.left-collapsed {
  grid-template-columns: 40px 1fr 220px;
}

.app.right-collapsed {
  grid-template-columns: 220px 1fr 40px;
}

/* EXISTING BEHAVIOR — UNCHANGED */
.app.left-collapsed .left .panel-content {
  display: none;
}

.app.right-collapsed .right .panel-content {
  display: none;
}

/* BUTTON — UNCHANGED */
.toggle-btn {
  background: #000;
  color: #fff;
  border: 1px solid #555;
  cursor: pointer;
  padding: 4px 6px;
  margin-bottom: 10px;
  font-size: 14px;
}

/* ========================= */
/* 🔧 ADDITIONS — LEFT PANEL */
/* ========================= */

.left-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.left-header .logo {
  font-weight: bold;
  font-size: 14px;
}

.left-nav {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.left-item {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.left-item .icon {
  width: 20px;
  text-align: center;
}

.left-item .label {
  white-space: nowrap;
}

/* HIDE LABELS WHEN COLLAPSED — ICONS ONLY */
.app.left-collapsed .left-item .label {
  display: none;
}

/* CENTER ICONS WHEN COLLAPSED */
.app.left-collapsed .left {
  padding: 10px 5px;
}

</style>
</head>

<body>

<div class="app" id="app">

  <!-- LEFT PANEL -->
  <div class="left">
    <button class="toggle-btn" onclick="toggleLeft()">❮</button>

    <!-- ADDED HEADER -->
    <div class="left-header">
      <div class="logo">SML</div>
    </div>

    <!-- ADDED NAV -->
    <div class="left-nav">
      <div class="left-item"><span class="icon">👤</span><span class="label">User</span></div>
      <div class="left-item"><span class="icon">🏠</span><span class="label">Home</span></div>
      <div class="left-item"><span class="icon">✱</span><span class="label">Create</span></div>
      <div class="left-item"><span class="icon">☰</span><span class="label">Library</span></div>
      <div class="left-item"><span class="icon">🔍</span><span class="label">Search</span></div>
      <div class="left-item"><span class="icon">🗑</span><span class="label">Trash</span></div>
      <div class="left-item"><span class="icon">💳</span><span class="label">Credits</span></div>
    </div>

    <!-- EXISTING CONTENT — UNCHANGED -->
    <div class="panel-content">
      <div class="block"></div>
    </div>
  </div>

  <!-- CENTER PANEL — UNCHANGED -->
  <div class="center">
    CENTER PANEL
    <div class="block"></div>
  </div>

  <!-- RIGHT PANEL — UNCHANGED -->
  <div class="right">
    <button class="toggle-btn" onclick="toggleRight()">❯</button>
    <div class="panel-content">
      RIGHT PANEL
      <div class="block"></div>
    </div>
  </div>

  <!-- PLAYER — UNCHANGED -->
  <div class="player">
    BOTTOM PLAYER BAR
  </div>

</div>

<script>
function toggleLeft() {
  document.getElementById('app').classList.toggle('left-collapsed');
}

function toggleRight() {
  document.getElementById('app').classList.toggle('right-collapsed');
}
</script>

</body>
</html>
