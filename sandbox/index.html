<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML – Sandbox Shell</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0f1115;
  --panel: #161a20;
  --panel-soft: #1b2028;
  --border-soft: #242a34;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: system-ui, sans-serif;
  overflow: hidden;
}

/* ===== GRID LAYOUT ===== */
.app {
  display: grid;
  grid-template-columns: 240px 1fr 260px;
  grid-template-rows: 1fr 72px;
  height: 100vh;
}

/* ===== LEFT PANEL ===== */
.left-panel {
  grid-column: 1;
  grid-row: 1 / span 2;
  background: var(--panel);
  border-right: 1px solid var(--border-soft);
  overflow-y: auto;
}

/* ===== CENTER PANEL ===== */
.center-panel {
  grid-column: 2;
  grid-row: 1;
  background: var(--panel-soft);
  overflow-y: auto;
}

/* ===== RIGHT PANEL ===== */
.right-panel {
  grid-column: 3;
  grid-row: 1 / span 2;
  background: var(--panel);
  border-left: 1px solid var(--border-soft);
  overflow-y: auto;
}

/* ===== BOTTOM PLAYER (CENTER ONLY) ===== */
.bottom-bar {
  grid-column: 2;
  grid-row: 2;
  background: linear-gradient(to top, #141820, #1a1f28);
  border-top: 1px solid var(--border-soft);
}

/* ===== SCROLLBARS ===== */
.left-panel::-webkit-scrollbar,
.center-panel::-webkit-scrollbar,
.right-panel::-webkit-scrollbar {
  width: 8px;
}

.left-panel::-webkit-scrollbar-thumb,
.center-panel::-webkit-scrollbar-thumb,
.right-panel::-webkit-scrollbar-thumb {
  background: #2a2f3a;
  border-radius: 8px;
}

.left-panel::-webkit-scrollbar-track,
.center-panel::-webkit-scrollbar-track,
.right-panel::-webkit-scrollbar-track {
  background: transparent;
}
</style>
</head>

<body>

<div class="app">

  <aside class="left-panel"></aside>

  <main class="center-panel"></main>

  <aside class="right-panel"></aside>

  <footer class="bottom-bar"></footer>

</div>

</body>
</html>
