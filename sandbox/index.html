<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Sandbox Layout</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* APP */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* MAIN AREA */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  overflow: hidden;
  transition: grid-template-columns 0.25s ease;
}

/* COLLAPSED STATES */
.main.left-collapsed {
  grid-template-columns: 0 1fr 220px;
}

.main.right-collapsed {
  grid-template-columns: 220px 1fr 0;
}

.main.both-collapsed {
  grid-template-columns: 0 1fr 0;
}

/* PANELS */
.left,
.center,
.right {
  overflow-y: auto;
  padding: 10px;
}

.left,
.right {
  background: #1e1e1e;
}

.center {
  background: #222;
}

/* HIDE CONTENT WHEN COLLAPSED */
.left.collapsed,
.right.collapsed {
  padding: 0;
  overflow: hidden;
}

/* TOGGLE BUTTONS */
.toggle {
  position: sticky;
  top: 10px;
  width: 28px;
  height: 28px;
  background: #2a2a2a;
  border: 1px solid #555;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.left .toggle {
  float: right;
}

.right .toggle {
  float: left;
}

/* BOTTOM PLAYER */
.player {
  height: 80px;
  background: #000;
  border-top: 2px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>

<div class="app">

  <div class="main" id="layout">

    <div class="left" id="leftPanel">
      <div class="toggle" onclick="toggleLeft()">⟨</div>
    </div>

    <div class="center">
      <!-- CENTER PANEL (UNCHANGED) -->
    </div>

    <div class="right" id="rightPanel">
      <div class="toggle" onclick="toggleRight()">⟩</div>
    </div>

  </div>

  <div class="player">
    BOTTOM PLAYER BAR
  </div>

</div>

<script>
const layout = document.getElementById("layout");
const left = document.getElementById("leftPanel");
const right = document.getElementById("rightPanel");

function toggleLeft() {
  left.classList.toggle("collapsed");
  layout.classList.toggle("left-collapsed");
}

function toggleRight() {
  right.classList.toggle("collapsed");
  layout.classList.toggle("right-collapsed");
}
</script>

</body>
</html>
