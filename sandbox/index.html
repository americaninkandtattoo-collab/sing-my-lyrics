<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Lite</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* ===== GRID LAYOUT (LOCKED) ===== */
.app {
  display: grid;
  grid-template-columns: 220px 1fr 1fr 260px;
  grid-template-rows: 1fr 80px;
  height: 100vh;
  width: 100vw;
}

/* ===== LEFT CONTROL PANEL ===== */
.left {
  grid-column: 1;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-right: 2px solid #444;
  padding: 12px;
}

.left .item {
  margin: 12px 0;
  cursor: pointer;
  opacity: 0.85;
}
.left .item:hover { opacity: 1; }

/* ===== CREATE PANEL ===== */
.create {
  grid-column: 2;
  grid-row: 1;
  background: #222;
  padding: 16px;
  overflow-y: auto;
}

.create h3 {
  margin: 10px 0 6px;
  font-size: 14px;
  font-weight: bold;
}

.create button {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  background: #111;
  color: #fff;
  border: 1px solid #444;
  cursor: pointer;
}

.row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.row button {
  flex: 1;
}

textarea,
input {
  width: 100%;
  padding: 8px;
  background: #111;
  color: #fff;
  border: 1px solid #444;
  margin-bottom: 10px;
}

.styles {
  border: 1px solid #444;
  background: #111;
  padding: 6px;
  height: 100px;
  overflow-y: auto;
  margin-bottom: 12px;
}

.styles div {
  padding: 4px;
  font-size: 13px;
}

/* ===== ADVANCED OPTIONS ===== */
.advanced {
  border-top: 1px solid #333;
  padding-top: 10px;
}

.slider-row {
  display: grid;
  grid-template-columns: 1fr 60px;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}

.slider-row label {
  grid-column: 1 / span 2;
  font-size: 13px;
  margin-bottom: 2px;
}

.slider-row input[type=range] {
  width: 100%;
}

.slider-row input[type=text] {
  text-align: center;
  background: #222;
}

/* ===== WORKSPACE / LIBRARY ===== */
.workspace {
  grid-column: 3;
  grid-row: 1;
  background: #1b1b1b;
  padding: 16px;
  overflow-y: auto;
}

.song-card {
  background: #222;
  border: 1px solid #444;
  padding: 10px;
  margin-bottom: 10px;
  font-size: 13px;
}

/* ===== SONG PANEL ===== */
.song-panel {
  grid-column: 4;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-left: 2px solid #444;
  padding: 12px;
  font-size: 13px;
}

.image-box {
  height: 150px;
  background: #333;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888;
}

/* ===== PLAYER ===== */
.player {
  grid-column: 2 / span 2;
  grid-row: 2;
  background: #0d0d0d;
  border-top: 2px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  font-size: 18px;
}
</style>
</head>

<body>
<div class="app">

  <!-- LEFT -->
  <div class="left">
    <div class="item">User</div>
    <div class="item">Home</div>
    <div class="item">Create</div>
    <div class="item">Library</div>
    <div class="item">Search</div>
    <div class="item">Trash</div>
    <div class="item">Credits</div>
  </div>

  <!-- CREATE -->
  <div class="create">
    <button>Create Song</button>
    <button>Record Audio</button>

    <div class="row">
      <button>Cadence: Original</button>
      <button>Reset Cadence</button>
    </div>

    <h3>Lyrics</h3>
    <textarea rows="5" placeholder="Enter lyrics here..."></textarea>

    <input placeholder="Add Song Title" />

    <h3>Styles</h3>
    <input placeholder="Type custom styles..." />

    <div class="styles">
      <div>Hardcore Punk</div>
      <div>Industrial</div>
      <div>Lo-Fi</div>
      <div>Hip-Hop</div>
    </div>

    <div class="advanced">
      <h3>Advanced Options</h3>

      <div class="slider-row">
        <label>Craziness</label>
        <input type="range" value="50">
        <input type="text" value="50%">
      </div>

      <div class="slider-row">
        <label>Style Influence</label>
        <input type="range" value="50">
        <input type="text" value="50%">
      </div>

      <div class="slider-row">
        <label>Audio Influence</label>
        <input type="range" value="50">
        <input type="text" value="50%">
      </div>
    </div>
  </div>

  <!-- WORKSPACE -->
  <div class="workspace">
    <div class="song-card">Untitled Song #1<br>Draft · Just now</div>
    <div class="song-card">Untitled Song #2<br>Draft · Today</div>
    <div class="song-card">Untitled Song #3<br>Draft · Today</div>
  </div>

  <!-- SONG PANEL -->
  <div class="song-panel">
    <div class="image-box">Generated Image</div>
    <div>User: You</div>
    <div style="margin-top:10px;">Select a song to preview lyrics</div>
  </div>

  <!-- PLAYER -->
  <div class="player">⏮ ▶ ⏭</div>

</div>
</body>
</html>
