<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Sandbox Layout</title>

<style>
/* LOCK THE PAGE */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* WHOLE APP */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* TOP AREA (LEFT / CENTER / RIGHT) */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  overflow: hidden;
}

/* PANELS */
.left,
.center,
.right {
  overflow-y: auto;
  border: 2px solid #666;
  padding: 10px;
}

/* COLORS SO YOU CAN SEE THEM */
.left   { background: #1e1e1e; }
.center { background: #222; }
.right  { background: #1e1e1e; }

/* BOTTOM PLAYER BAR */
.player {
  height: 80px;
  background: #000;
  border-top: 2px solid #666;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* FAKE CONTENT TO FORCE SCROLLBARS */
.block {
  height: 1200px;
  border: 1px dashed #444;
}
</style>
</head>

<body>

<div class="app">

  <div class="main">
    <div class="left">
      LEFT PANEL
      <div class="block"></div>
    </div>

    <div class="center">
      CENTER PANEL
      <div class="block"></div>
    </div>

    <div class="right">
      RIGHT PANEL
      <div class="block"></div>
    </div>
  </div>

  <div class="player">
    BOTTOM PLAYER BAR
  </div>

</div>

</body>
</html>
