<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Sandbox Layout</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* APP GRID — UNCHANGED */
.app {
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  grid-template-rows: 1fr 80px;
  height: 100vh;
  width: 100vw;
  transition: grid-template-columns 0.25s ease;
}

/* PANELS — UNCHANGED */
.left {
  grid-column: 1;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-right: 2px solid #555;
  overflow-y: auto;
  padding: 10px;
}

.center {
  grid-column: 2;
  grid-row: 1;
  background: #222;
  overflow-y: auto;
  padding: 10px;
}

.right {
  grid-column: 3;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-left: 2px solid #555;
  overflow-y: auto;
  padding: 10px;
}

/* BOTTOM PLAYER — UNCHANGED CONTAINER */
.player {
  grid-column: 2;
  grid-row: 2;
  background: #0d0d0d;
  border-top: 2px solid #555;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
}

/* COLLAPSE STATES — UNCHANGED */
.app.left-collapsed {
  grid-template-columns: 40px 1fr 220px;
}

.app.right-collapsed {
  grid-template-columns: 220px 1fr 40px;
}

.app.left-collapsed .left .panel-content {
  display: none;
}

.app.right-collapsed .right .panel-content {
  display: none;
}

/* BUTTON — UNCHANGED */
.toggle-btn {
  background: #000;
  color: #fff;
  border: 1px solid #555;
  cursor: pointer;
  padding: 4px 6px;
  margin-bottom: 10px;
  font-size: 14px;
}

/* ========================= */
/* 🔧 LEFT PANEL ADDITIONS   */
/* ========================= */

.left-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.left-header .logo {
  font-weight: bold;
  font-size: 14px;
}

.left-nav {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.left-item {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.left-item .icon {
  width: 20px;
  text-align: center;
}

.left-item .label {
  white-space: nowrap;
}

.app.left-collapsed .left-item .label {
  display: none;
}

.app.left-collapsed .left {
  padding: 10px 5px;
}

/* ========================= */
/* 🔊 PLAYER ADDITIONS ONLY  */
/* ========================= */

.player-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.player-btn {
  cursor: pointer;
  opacity: 0.85;
}

.player-btn:hover {
  opacity: 1;
}

.player-timeline {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}

.player-time {
  font-size: 12px;
  color: #aaa;
  min-width: 40px;
  text-align: center;
}

.player-bar {
  flex: 1;
  height: 4px;
  background: #333;
  border-radius: 2px;
  position: relative;
}

.player-bar-fill {
  width: 25%;
  height: 100%;
  background: #fff;
  border-radius: 2px;
}
</style>
</head>

<body>

<div class="app" id="app">

  <!-- LEFT PANEL -->
  <div class="left">
    <button class="toggle-btn" onclick="toggleLeft()">❮</button>

    <div class="left-header">
      <div class="logo">SML</div>
    </div>

    <div class="left-nav">
      <div class="left-item"><span class="icon">👤</span><span class="label">User</span></div>
      <div class="left-item"><span class="icon">🏠</span><span class="label">Home</span></div>
      <div class="left-item"><span class="icon">✱</span><span class="label">Create</span></div>
      <div class="left-item"><span class="icon">☰</span><span class="label">Library</span></div>
      <div class="left-item"><span class="icon">🔍</span><span class="label">Search</span></div>
      <div class="left-item"><span class="icon">🗑</span><span class="label">Trash</span></div>
      <div class="left-item"><span class="icon">💳</span><span class="label">Credits</span></div>
    </div>

    <div class="panel-content"></div>
  </div>

  <!-- CENTER PANEL -->
  <div class="center">CENTER PANEL</div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <button class="toggle-btn" onclick="toggleRight()">❯</button>
    <div class="panel-content">RIGHT PANEL</div>
  </div>

  <!-- 🔊 PLAYER — SURGICAL CONTENT -->
  <div class="player">

    <div class="player-controls">
      <span class="player-btn">🔀</span>
      <span class="player-btn">⏮</span>
      <span class="player-btn">▶️</span>
      <span class="player-btn">⏭</span>
      <span class="player-btn">🔁</span>
    </div>

    <div class="player-timeline">
      <div class="player-time">0:00</div>
      <div class="player-bar">
        <div class="player-bar-fill"></div>
      </div>
      <div class="player-time">3:30</div>
    </div>

  </div>

</div>

<script>
function toggleLeft() {
  document.getElementById('app').classList.toggle('left-collapsed');
}

function toggleRight() {
  document.getElementById('app').classList.toggle('right-collapsed');
}
</script>

</body>
</html>
