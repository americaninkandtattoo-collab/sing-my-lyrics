<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    background: #000;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 220px 1fr 260px;
    grid-template-rows: 1fr 80px;
    height: 100vh;
    width: 100vw;
  }

  .left-panel {
    grid-row: 1 / 3;
    background: #111;
    border: 3px solid red;
  }

  .main {
    background: #000;
    border: 3px solid lime;
  }

  .right-panel {
    grid-row: 1 / 3;
    background: #111;
    border: 3px solid blue;
  }

  .player {
    grid-column: 2 / 3;
    background: #222;
    border: 3px solid yellow;
  }
</style>
