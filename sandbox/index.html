<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Sandbox Layout</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* MAIN GRID */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  overflow: hidden;
  transition: grid-template-columns 0.25s ease;
}

/* PANELS */
.left,
.center,
.right {
  overflow-y: auto;
  padding: 10px;
}

/* COLORS */
.left   { background: #1e1e1e; }
.center { background: #222; }
.right  { background: #1e1e1e; }

/* PLAYER BAR */
.player {
  height: 80px;
  background: #000;
  border-top: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* COLLAPSED STATES */
.main.left-collapsed {
  grid-template-columns: 40px 1fr 220px;
}

.main.right-collapsed {
  grid-template-columns: 220px 1fr 40px;
}

.main.both-collapsed {
  grid-template-columns: 40px 1fr 40px;
}

/* COLLAPSE BUTTONS */
.collapse-btn {
  position: sticky;
  top: 0;
  background: #111;
  border: none;
  color: #aaa;
  font-size: 16px;
  cursor: pointer;
  padding: 6px;
  width: 100%;
}

.collapse-btn:hover {
  color: #fff;
}
</style>
</head>

<body>

<div class="app">

  <div class="main" id="mainLayout">

    <!-- LEFT PANEL -->
    <div class="left">
      <button class="collapse-btn" onclick="toggleLeft()">⮜</button>
      LEFT PANEL
    </div>

    <!-- CENTER PANEL -->
    <div class="center">
      CENTER PANEL
    </div>

    <!-- RIGHT PANEL -->
    <div class="right">
      <button class="collapse-btn" onclick="toggleRight()">⮞</button>
      RIGHT PANEL
    </div>

  </div>

  <!-- BOTTOM PLAYER (STAYS BETWEEN PANELS) -->
  <div class="player">
    BOTTOM PLAYER BAR
  </div>

</div>

<script>
const main = document.getElementById("mainLayout");

function toggleLeft() {
  if (main.classList.contains("left-collapsed")) {
    main.classList.remove("left-collapsed");
  } else {
    main.classList.remove("both-collapsed");
    main.classList.add("left-collapsed");
  }
  syncBoth();
}

function toggleRight() {
  if (main.classList.contains("right-collapsed")) {
    main.classList.remove("right-collapsed");
  } else {
    main.classList.remove("both-collapsed");
    main.classList.add("right-collapsed");
  }
  syncBoth();
}

function syncBoth() {
  if (
    main.classList.contains("left-collapsed") &&
    main.classList.contains("right-collapsed")
  ) {
    main.classList.remove("left-collapsed", "right-collapsed");
    main.classList.add("both-collapsed");
  }
}
</script>

</body>
</html>
