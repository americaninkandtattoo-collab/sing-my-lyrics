<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Light</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* GRID — LOCKED */
.app {
  display: grid;
  grid-template-columns: 220px 1fr 1fr 260px;
  grid-template-rows: 1fr 80px;
  height: 100vh;
}

/* LEFT */
.left {
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-right: 2px solid #444;
  padding: 12px;
}
.left div { margin: 10px 0; cursor: pointer; }

/* CREATE */
.create {
  padding: 16px;
  background: #222;
  overflow-y: auto;
}
.create input, .create textarea, .create button {
  width: 100%;
  margin-bottom: 10px;
  padding: 8px;
  background: #111;
  color: #fff;
  border: 1px solid #444;
}

/* LIBRARY */
.library {
  background: #1b1b1b;
  padding: 16px;
  overflow-y: auto;
}
.song-card {
  background: #222;
  border: 1px solid #444;
  padding: 10px;
  margin-bottom: 10px;
  cursor: pointer;
}

/* SONG PANEL */
.song-panel {
  background: #1e1e1e;
  border-left: 2px solid #444;
  padding: 12px;
  font-size: 13px;
}

/* PLAYER */
.player {
  grid-column: 2 / span 2;
  background: #0d0d0d;
  border-top: 2px solid #444;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
}
.player input[type=range] { flex: 1; }
</style>
</head>

<body>
<div class="app">

  <!-- LEFT -->
  <div class="left">
    <div>User</div>
    <div>Home</div>
    <div>Create</div>
    <div>Library</div>
    <div>Trash</div>
  </div>

  <!-- CREATE -->
  <div class="create">
    <button id="createTop">Create Song</button>

    <textarea id="lyrics" placeholder="Lyrics (required)"></textarea>
    <input id="title" placeholder="Song title (optional)" />
    <input id="style" placeholder="Style / vibe" />
    <input id="exclude" placeholder="Styles to exclude" />

    <input id="audioInfluence" placeholder="Audio Influence %" />
    <input id="artSeed" placeholder="Art Seed / Variation %" />

    <button id="createBottom">Create Song</button>
    <button id="exportLyrics">Export Lyrics</button>
    <button id="exportSheet">Export Sheet Music (Placeholder)</button>
  </div>

  <!-- LIBRARY -->
  <div class="library" id="library"></div>

  <!-- SONG PANEL -->
  <div class="song-panel">
    <div id="songImage" style="height:140px;background:#333;margin-bottom:10px;display:flex;align-items:center;justify-content:center;">
      Generated Image
    </div>
    <div id="songUser"></div>
    <div id="songTitle"></div>
    <pre id="songLyrics"></pre>
  </div>

  <!-- PLAYER -->
  <div class="player">
    <button id="play">▶</button>
    <button id="stop">■</button>
    <input id="seek" type="range" min="0" max="100" value="0">
  </div>

</div>

<script>
const tracks = JSON.parse(localStorage.getItem("tracks") || "[]");
const library = document.getElementById("library");

function renderLibrary() {
  library.innerHTML = "";
  tracks.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="song-card";
    d.textContent=t.title||"Untitled Song";
    d.onclick=()=>selectSong(t);
    library.appendChild(d);
  });
}
renderLibrary();

function selectSong(t){
  songTitle.textContent = t.title || "";
  songUser.textContent = "User: YOU";
  songLyrics.textContent = t.lyrics;
}

function createSong(){
  const lyrics=document.getElementById("lyrics").value.trim();
  if(!lyrics) return;
  const title=document.getElementById("title").value;
  tracks.push({title,lyrics});
  localStorage.setItem("tracks",JSON.stringify(tracks));
  renderLibrary();
}

createTop.onclick=createSong;
createBottom.onclick=createSong;

exportLyrics.onclick=()=>{
  const blob=new Blob([lyrics.value],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="lyrics.txt";
  a.click();
};

exportSheet.onclick=()=>{
  alert("Sheet music export coming soon.");
};

/* PLAYER */
let audioCtx,osc;
play.onclick=()=>{
  audioCtx=new AudioContext();
  osc=audioCtx.createOscillator();
  osc.connect(audioCtx.destination);
  osc.start();
};
stop.onclick=()=>{
  if(osc){osc.stop();osc.disconnect();}
};
</script>
</body>
</html>
