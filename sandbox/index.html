<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Sandbox Layout</title>

<style>
/* ===== LOCK PAGE ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* ===== APP ===== */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ===== MAIN GRID ===== */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  overflow: hidden;
  transition: grid-template-columns 0.25s ease;
}

/* ===== PANELS ===== */
.left,
.center,
.right {
  overflow-y: auto;
  border: 2px solid #666;
  padding: 10px;
}

.left   { background: #1e1e1e; }
.center { background: #222; }
.right  { background: #1e1e1e; }

/* ===== COLLAPSED STATES ===== */
.main.left-collapsed {
  grid-template-columns: 32px 1fr 220px;
}

.main.right-collapsed {
  grid-template-columns: 220px 1fr 32px;
}

.main.left-collapsed.right-collapsed {
  grid-template-columns: 32px 1fr 32px;
}

/* ===== COLLAPSE BUTTONS ===== */
.collapse-btn {
  position: sticky;
  top: 0;
  background: #000;
  color: #aaa;
  border: none;
  width: 100%;
  height: 28px;
  cursor: pointer;
  font-size: 12px;
}

.collapse-btn:hover {
  color: #fff;
}

/* ===== BOTTOM PLAYER ===== */
.player {
  height: 80px;
  background: #000;
  border-top: 2px solid #666;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== SCROLL FORCE ===== */
.block {
  height: 1200px;
  border: 1px dashed #444;
}
</style>
</head>

<body>

<div class="app">

  <div class="main" id="mainLayout">

    <div class="left">
      <button class="collapse-btn" onclick="toggleLeft()">◀</button>
      LEFT PANEL
      <div class="block"></div>
    </div>

    <div class="center">
      CENTER PANEL
      <div class="block"></div>
    </div>

    <div class="right">
      <button class="collapse-btn" onclick="toggleRight()">▶</button>
      RIGHT PANEL
      <div class="block"></div>
    </div>

  </div>

  <div class="player">
    BOTTOM PLAYER BAR
  </div>

</div>

<script>
const main = document.getElementById("mainLayout");

function toggleLeft() {
  main.classList.toggle("left-collapsed");
}

function toggleRight() {
  main.classList.toggle("right-collapsed");
}
</script>

</body>
</html>
