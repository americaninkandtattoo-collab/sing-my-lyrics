<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sing My Lyrics Lite</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ===== APP GRID ===== */
.app{
  display:grid;
  grid-template-columns:220px 1fr 320px;
  grid-template-rows:1fr 70px;
  height:100vh;
  transition:.25s;
}

/* ===== LEFT PANEL ===== */
.left{
  grid-row:1 / span 2;
  background:#1e1e1e;
  border-right:2px solid #444;
  padding:10px;
}
.app.left-collapsed{
  grid-template-columns:50px 1fr 320px;
}
.left button{
  width:100%;
  background:#000;
  border:1px solid #555;
  color:#fff;
  cursor:pointer;
  margin-bottom:10px;
}
.nav a{
  display:flex;
  gap:10px;
  padding:6px;
  cursor:pointer;
  text-decoration:none;
  color:#fff;
}
.app.left-collapsed .label{display:none}

/* ===== CENTER ===== */
.center{
  background:#222;
  padding:12px;
  overflow:auto;
}
.create-wrap{
  max-width:360px;
}
.section{margin-bottom:14px}
input,textarea{
  width:100%;
  background:#181818;
  border:1px solid #333;
  color:#fff;
  padding:6px;
  resize:none;
}
.row{display:flex;gap:6px}
.btn{
  background:#000;
  border:1px solid #555;
  color:#fff;
  cursor:pointer;
  padding:8px;
}

/* ===== RIGHT / LIBRARY ===== */
.right{
  background:#1e1e1e;
  border-left:2px solid #444;
  padding:10px;
  overflow:auto;
}
.song-card{
  background:#181818;
  border:1px solid #333;
  padding:8px;
  margin-bottom:10px;
}

/* ===== PLAYER ===== */
.player{
  grid-column:2;
  background:#0d0d0d;
  border-top:2px solid #444;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 12px;
}
.bar{
  flex:1;
  height:4px;
  background:#333;
}
.fill{width:25%;height:100%;background:#fff}
</style>
</head>

<body>

<div class="app" id="app">

<!-- LEFT -->
<div class="left">
  <button onclick="toggleLeft()">❮</button>
  <div class="nav">
    <a onclick="showCreate()"><span>*</span><span class="label">Create</span></a>
    <a onclick="showLibrary()"><span>📁</span><span class="label">Library</span></a>
  </div>
</div>

<!-- CENTER -->
<div class="center">
  <div class="create-wrap" id="createView">
    <div class="section"><button class="btn">Create Song</button></div>
    <div class="section"><button class="btn">Record Audio</button></div>

    <div class="section row">
      <button class="btn" onclick="cadence()">Cadence</button>
      <button class="btn" onclick="resetLyrics()">Reset</button>
    </div>

    <div class="section">
      <textarea id="lyrics" placeholder="Enter lyrics..."></textarea>
    </div>

    <div class="section">
      <input placeholder="Song Title">
    </div>

    <div class="section">
      <textarea id="style" placeholder="Styles"></textarea>
    </div>

    <div class="section">
      <div>Craziness</div>
      <input value="50%">
      <div>Style Influence</div>
      <input value="50%">
      <div>Audio Influence</div>
      <input value="50%">
    </div>

    <button class="btn">Create Song</button>
  </div>

  <div id="libraryView" style="display:none">
    <h3>Your Songs</h3>
    <p>Same songs as Create — different view.</p>
  </div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="song-card">
    <strong>Song Preview</strong>
    <p>Lyrics appear here</p>
  </div>
</div>

<!-- PLAYER -->
<div class="player">
  ▶
  <div class="bar"><div class="fill"></div></div>
  0:25
</div>

</div>

<script>
let collapsed=false;
function toggleLeft(){
  collapsed=!collapsed;
  document.getElementById('app').classList.toggle('left-collapsed',collapsed);
}
function showCreate(){
  createView.style.display='block';
  libraryView.style.display='none';
}
function showLibrary(){
  createView.style.display='none';
  libraryView.style.display='block';
}
let original='';
function cadence(){
  if(!original) original=lyrics.value;
  lyrics.value=original.split(/\s+/).join(" / ");
}
function resetLyrics(){
  lyrics.value=original;
}
</script>

</body>
</html>
