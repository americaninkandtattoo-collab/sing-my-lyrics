<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML – Sandbox Shell</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0f1115;
  --panel: #161a20;
  --panel-soft: #1b2028;
  --border: #242a34;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: system-ui, sans-serif;
  overflow: hidden;
}

.app {
  display: grid;
  grid-template-columns: 240px 1fr 260px;
  grid-template-rows: 1fr 72px;
  height: 100vh;
  width: 100vw;
}

/* LEFT */
.left-panel {
  grid-row: 1 / span 2;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
}

/* CENTER */
.center-panel {
  grid-column: 2;
  grid-row: 1;
  background: var(--panel-soft);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  overflow-y: auto;
}

/* RIGHT */
.right-panel {
  grid-row: 1 / span 2;
  background: var(--panel);
  border-left: 1px solid var(--border);
  overflow-y: auto;
}

/* BOTTOM PLAYER — CENTER ONLY */
.bottom-bar {
  grid-column: 2;
  grid-row: 2;
  background: #141820;
  border-top: 1px solid var(--border);
}
</style>
</head>

<body>
<div class="app">
  <aside class="left-panel"></aside>
  <main class="center-panel"></main>
  <aside class="right-panel"></aside>
  <footer class="bottom-bar"></footer>
</div>
</body>
</html>
