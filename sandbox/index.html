<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SML Light – Sandbox Shell</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    background: #0f172a;
    color: #e5e7eb;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  /* MAIN GRID */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr 220px;
    grid-template-rows: 1fr 90px;
    height: 100vh;
  }

  /* LEFT PANEL */
  .left-panel {
    grid-row: 1 / 3;
    background: #020617;
    border-right: 1px solid #1e293b;
  }

  /* RIGHT PANEL */
  .right-panel {
    grid-row: 1 / 3;
    background: #020617;
    border-left: 1px solid #1e293b;
  }

  /* CENTER EMPTY SPACE */
  .center {
    background: #0b1220;
  }

  /* PLAYER BAR */
  .player {
    grid-column: 2 / 3;
    background: #020617;
    border-top: 1px solid #1e293b;
  }
</style>
</head>

<body>
  <div class="app">

    <div class="left-panel"></div>

    <div class="center"></div>

    <div class="right-panel"></div>

    <div class="player"></div>

  </div>
</body>
</html>
