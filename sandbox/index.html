<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Lite</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* === APP GRID (MATCHES YOUR DRAWING) === */
.app {
  display: grid;
  grid-template-columns: 220px 1fr 1fr 260px;
  grid-template-rows: 1fr 80px;
  height: 100vh;
  width: 100vw;
}

/* === LEFT CONTROL PANEL === */
.left {
  grid-column: 1;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-right: 2px solid #444;
  padding: 12px;
}

.left .item {
  margin: 10px 0;
  cursor: pointer;
}

/* === CREATE PAGE === */
.create {
  grid-column: 2;
  grid-row: 1;
  background: #222;
  padding: 16px;
  overflow-y: auto;
}

.create input,
.create textarea,
.create button {
  width: 100%;
  margin-bottom: 10px;
  padding: 8px;
  background: #111;
  color: #fff;
  border: 1px solid #444;
}

/* === WORKSPACE / LIBRARY === */
.workspace {
  grid-column: 3;
  grid-row: 1;
  background: #1b1b1b;
  padding: 16px;
  overflow-y: auto;
}

.song-card {
  background: #222;
  border: 1px solid #444;
  padding: 10px;
  margin-bottom: 10px;
}

/* === SONG PANEL === */
.song-panel {
  grid-column: 4;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-left: 2px solid #444;
  padding: 12px;
  font-size: 13px;
}

/* === PLAYER BAR === */
.player {
  grid-column: 2 / span 2;
  grid-row: 2;
  background: #0d0d0d;
  border-top: 2px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
</style>
</head>

<body>
<div class="app">

  <!-- LEFT CONTROL PANEL -->
  <div class="left">
    <div class="item">User</div>
    <div class="item">Home</div>
    <div class="item">Create</div>
    <div class="item">Library</div>
    <div class="item">Search</div>
    <div class="item">Trash</div>
    <div class="item">Credits</div>
  </div>

  <!-- CREATE PAGE -->
  <div class="create">
    <button>Create Song</button>
    <button>Record Audio</button>

    <textarea rows="6" placeholder="Enter lyrics here..."></textarea>
    <input placeholder="Song title" />
    <input placeholder="Styles" />
  </div>

  <!-- WORKSPACE / LIBRARY -->
  <div class="workspace">
    <div class="song-card">Untitled Song #1</div>
    <div class="song-card">Untitled Song #2</div>
    <div class="song-card">Untitled Song #3</div>
  </div>

  <!-- SONG PANEL -->
  <div class="song-panel">
    <div style="height:140px;background:#333;margin-bottom:10px;display:flex;align-items:center;justify-content:center;">
      Generated Image
    </div>
    <div>User: You</div>
    <div style="margin-top:10px;">
      Select a song to preview lyrics
    </div>
  </div>

  <!-- PLAYER BAR -->
  <div class="player">
    ⏮ ▶ ⏭
  </div>

</div>
</body>
</html>
