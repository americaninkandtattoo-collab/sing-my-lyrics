<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Sandbox Layout</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

/* APP GRID — UNCHANGED */
.app {
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  grid-template-rows: 1fr 80px;
  height: 100vh;
  width: 100vw;
  transition: grid-template-columns 0.25s ease;
}

/* PANELS — UNCHANGED (visual polish only) */
.left {
  grid-column: 1;
  grid-row: 1 / span 2;
  background: #181818;
  border-right: 1px solid #2a2a2a;
  overflow-y: auto;
  padding: 12px;
}

.center {
  grid-column: 2;
  grid-row: 1;
  background: #202020;
  overflow-y: auto;
  padding: 16px;
}

.right {
  grid-column: 3;
  grid-row: 1 / span 2;
  background: #181818;
  border-left: 1px solid #2a2a2a;
  overflow-y: auto;
  padding: 12px;
}

/* BOTTOM PLAYER — UNCHANGED (visual polish only) */
.player {
  grid-column: 2;
  grid-row: 2;
  background: linear-gradient(to top, #0d0d0d, #151515);
  border-top: 1px solid #2a2a2a;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* COLLAPSE STATES — UNCHANGED */
.app.left-collapsed {
  grid-template-columns: 40px 1fr 220px;
}

.app.right-collapsed {
  grid-template-columns: 220px 1fr 40px;
}

/* EXISTING BEHAVIOR — UNCHANGED */
.app.left-collapsed .left .panel-content {
  display: none;
}

.app.right-collapsed .right .panel-content {
  display: none;
}

/* TOGGLE BUTTON — VISUAL POLISH ONLY */
.toggle-btn {
  background: #0f0f0f;
  color: #aaa;
  border: 1px solid #2a2a2a;
  cursor: pointer;
  padding: 4px 6px;
  margin-bottom: 12px;
  font-size: 13px;
  border-radius: 4px;
}

.toggle-btn:hover {
  color: #fff;
  border-color: #444;
}

/* ========================= */
/* LEFT PANEL — VISUAL POLISH */
/* ========================= */

.left-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid #2a2a2a;
}

.left-header .logo {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.5px;
  opacity: 0.9;
}

.left-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 12px;
}

.left-item {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  padding: 8px 10px;
  border-radius: 6px;
  color: #bdbdbd;
  transition: background 0.15s ease, color 0.15s ease;
}

.left-item:hover {
  background: #242424;
  color: #fff;
}

.left-item .icon {
  width: 20px;
  text-align: center;
  opacity: 0.85;
}

.left-item .label {
  white-space: nowrap;
  font-size: 14px;
}

/* COLLAPSED STATE — ICONS ONLY (UNCHANGED BEHAVIOR) */
.app.left-collapsed .left-item .label {
  display: none;
}

.app.left-collapsed .left {
  padding: 12px 6px;
}

</style>
</head>

<body>

<div class="app" id="app">

  <!-- LEFT PANEL -->
  <div class="left">
    <button class="toggle-btn" onclick="toggleLeft()">❮</button>

    <div class="left-header">
      <div class="logo">SML</div>
    </div>

    <div class="left-nav">
      <div class="left-item"><span class="icon">👤</span><span class="label">User</span></div>
      <div class="left-item"><span class="icon">🏠</span><span class="label">Home</span></div>
      <div class="left-item"><span class="icon">✱</span><span class="label">Create</span></div>
      <div class="left-item"><span class="icon">☰</span><span class="label">Library</span></div>
      <div class="left-item"><span class="icon">🔍</span><span class="label">Search</span></div>
      <div class="left-item"><span class="icon">🗑</span><span class="label">Trash</span></div>
      <div class="left-item"><span class="icon">💳</span><span class="label">Credits</span></div>
    </div>

    <div class="panel-content">
      <div class="block"></div>
    </div>
  </div>

  <!-- CENTER PANEL -->
  <div class="center">
    CENTER PANEL
    <div class="block"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <button class="toggle-btn" onclick="toggleRight()">❯</button>
    <div class="panel-content">
      RIGHT PANEL
      <div class="block"></div>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="player">
    BOTTOM PLAYER BAR
  </div>

</div>

<script>
function toggleLeft() {
  document.getElementById('app').classList.toggle('left-collapsed');
}

function toggleRight() {
  document.getElementById('app').classList.toggle('right-collapsed');
}
</script>

</body>
</html>
