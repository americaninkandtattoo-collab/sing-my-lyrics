<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SML Sandbox Layout</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* APP GRID */
.app {
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  grid-template-rows: 1fr 80px;
  height: 100vh;
  width: 100vw;
}

/* PANELS */
.left {
  grid-column: 1;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-right: 2px solid #555;
  overflow-y: auto;
  padding: 10px;
}

.center {
  grid-column: 2;
  grid-row: 1;
  background: #222;
  overflow-y: auto;
  padding: 10px;
}

.right {
  grid-column: 3;
  grid-row: 1 / span 2;
  background: #1e1e1e;
  border-left: 2px solid #555;
  overflow-y: auto;
  padding: 10px;
}

/* BOTTOM PLAYER — CENTER ONLY */
.player {
  grid-column: 2;
  grid-row: 2;
  background: #000;
  border-top: 2px solid #555;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* DEBUG CONTENT */
.block {
  height: 1200px;
  border: 1px dashed #444;
}
</style>
</head>

<body>

<div class="app">

  <div class="left">
    LEFT PANEL
    <div class="block"></div>
  </div>

  <div class="center">
    CENTER PANEL
    <div class="block"></div>
  </div>

  <div class="right">
    RIGHT PANEL
    <div class="block"></div>
  </div>

  <div class="player">
    BOTTOM PLAYER BAR
  </div>

</div>

</body>
</html>
