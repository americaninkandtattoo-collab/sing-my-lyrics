<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sing My Lyrics (SML)</title>

<style>
:root{
  --bg:#0e1116;
  --panel:#151a22;
  --panel2:#1b2230;
  --text:#e7eaf0;
  --muted:#9aa3b2;
  --accent:#3bff88;
  --danger:#ff5c5c;
  --border:#2a3242;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
}
.app{
  display:grid;
  grid-template-columns:240px 1fr 280px;
  height:100vh;
}

/* LEFT NAV */
.nav{
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:12px;
}
.logo{
  font-weight:700;
  font-size:18px;
  margin-bottom:16px;
}
.nav button{
  width:100%;
  background:none;
  border:1px solid var(--border);
  color:var(--text);
  padding:10px;
  margin-bottom:8px;
  text-align:left;
  cursor:pointer;
}
.nav button.active{border-color:var(--accent); color:var(--accent)}
.nav small{color:var(--muted)}

/* CENTER */
.main{
  background:var(--panel2);
  padding:16px;
  overflow:auto;
}
.view{display:none}
.view.active{display:block}

/* RIGHT PLAYER */
.player{
  background:var(--panel);
  border-left:1px solid var(--border);
  padding:12px;
}
.player h3{margin-top:0}
audio{width:100%}

/* CARDS */
.card{
  border:1px solid var(--border);
  padding:12px;
  margin-bottom:10px;
  background:#0f141c;
}
.actions{
  display:flex;
  gap:8px;
}
.actions button{
  flex:1;
  padding:8px;
  cursor:pointer;
}

/* CREATE */
textarea{
  width:100%;
  height:140px;
  background:#0f141c;
  border:1px solid var(--border);
  color:var(--text);
  padding:10px;
}
select, input{
  width:100%;
  margin-top:8px;
  padding:8px;
  background:#0f141c;
  color:var(--text);
  border:1px solid var(--border);
}

/* MENU */
.menu{
  position:relative;
}
.menu-content{
  display:none;
  position:absolute;
  right:0;
  top:24px;
  background:#0f141c;
  border:1px solid var(--border);
}
.menu-content button{
  display:block;
  width:100%;
  border:none;
  background:none;
  color:var(--text);
  padding:8px;
  text-align:left;
}
.menu-content button:hover{background:#182030}
.menu.open .menu-content{display:block}
</style>
</head>

<body>
<div class="app">

  <!-- LEFT -->
  <div class="nav">
    <div class="logo">SML</div>
    <button data-nav="#home">Home</button>
    <button data-nav="#create">Create</button>
    <button data-nav="#library">Library</button>
    <button data-nav="#trash">Trash</button>
    <small>You own your lyrics. Always.</small>
  </div>

  <!-- CENTER -->
  <div class="main">
    <div id="home" class="view">
      <h2>Human words. Finally heard.</h2>
      <p>We never write lyrics for you. You keep 100% ownership.</p>
      <button onclick="go('#create')">Go to Create</button>
    </div>

    <div id="create" class="view">
      <h2>Create</h2>
      <textarea id="lyrics" placeholder="Paste your lyrics here"></textarea>
      <select id="style">
        <option>Rock</option>
        <option>Punk</option>
        <option>Hip Hop</option>
        <option>Electronic</option>
      </select>
      <button onclick="generate()">Generate Song</button>
    </div>

    <div id="library" class="view">
      <h2>Library</h2>
      <div id="songs"></div>
    </div>

    <div id="trash" class="view">
      <h2>Trash (30 days)</h2>
      <div id="trashList"></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="player">
    <h3>Now Playing</h3>
    <div id="nowPlaying">Nothing</div>
    <audio id="audio" controls></audio>
  </div>

</div>

<script>
const views=[...document.querySelectorAll('.view')];
const navBtns=[...document.querySelectorAll('[data-nav]')];
let songs=[], trash=[];

function go(hash){
  location.hash=hash;
}

function show(){
  const h=location.hash||'#home';
  views.forEach(v=>v.classList.remove('active'));
  navBtns.forEach(b=>b.classList.remove('active'));
  document.querySelector(h)?.classList.add('active');
  document.querySelector([data-nav="${h}"])?.classList.add('active');
}
window.addEventListener('hashchange',show);
show();

function fakeAudio(){
  const ctx=new AudioContext();
  const osc=ctx.createOscillator();
  const dst=ctx.createMediaStreamDestination();
  osc.connect(dst);
  osc.start();
  return dst.stream;
}

function generate(){
  const song={
    id:Date.now(),
    title:'Untitled Song',
    lyrics:lyrics.value,
    public:false
  };
  songs.unshift(song);
  render();
  play(song);
}

function play(song){
  nowPlaying.textContent=song.title;
  audio.srcObject=fakeAudio();
}

function render(){
  songsEl.innerHTML='';
  songs.forEach(s=>{
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML=`
      <strong>${s.title}</strong>
      <div class="menu">
        ⋮
        <div class="menu-content">
          <button onclick="togglePub(${s.id})">${s.public?'Make Private':'Make Public'}</button>
          <button onclick="del(${s.id})">Delete</button>
        </div>
      </div>
      <button onclick="playById(${s.id})">Play</button>
    `;
    d.querySelector('.menu').onclick=()=>d.querySelector('.menu').classList.toggle('open');
    songsEl.appendChild(d);
  });

  trashList.innerHTML='';
  trash.forEach(t=>{
    const d=document.createElement('div');
    d.className='card';
    d.textContent=t.title;
    trashList.appendChild(d);
  });
}

function playById(id){
  play(songs.find(s=>s.id===id));
}
function del(id){
  const i=songs.findIndex(s=>s.id===id);
  trash.push(songs[i]);
  songs.splice(i,1);
  render();
}
function togglePub(id){
  const s=songs.find(s=>s.id===id);
  s.public=!s.public;
  render();
}
const songsEl=document.getElementById('songs');
</script>
</body>
</html>
