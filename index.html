<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SML – Home</title>

<style>
/* ===== HOME PAGE ONLY — SCOPED ===== */

.home-layout {
  display: grid;
  grid-template-columns: 1fr 420px;
  height: 100%;
  gap: 12px;
}

.home-main {
  background: #0f2f4a;
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
}

.home-main h2 {
  margin: 0 0 8px 0;
}

.now-playing {
  flex: 1;
  background: #0b2438;
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 12px;
}

.transport-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 8px;
}

.transport-bar button {
  background: #143d5c;
  border: none;
  color: #fff;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
}

.home-right {
  background: #0f2f4a;
  border-radius: 8px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.album-art {
  height: 220px;
  background: #0b2438;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6fa3c7;
  font-size: 14px;
}

.song-meta {
  background: #0b2438;
  border-radius: 6px;
  padding: 10px;
  font-size: 14px;
}

.song-meta div {
  margin-bottom: 6px;
}
</style>
</head>

<body>

<!-- ASSUMES YOUR EXISTING SIDEBAR IS ALREADY RENDERED -->

<div class="page-content">

  <h1>Making rock stars — one human at a time.</h1>
  <p>No AI lyrics. You write the words. You keep 100% ownership.</p>

  <div class="home-layout">

    <!-- CENTER -->
    <div class="home-main">
      <h2>Library / Now Playing</h2>

      <div class="now-playing">
        <p>No track selected</p>
      </div>

      <div class="transport-bar">
        <button>⏮</button>
        <button>▶</button>
        <button>⏸</button>
        <button>⏭</button>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="home-right">

      <div class="album-art">
        Generated Image
      </div>

      <div class="song-meta">
        <div><strong>Song:</strong> —</div>
        <div><strong>Lyrics:</strong> User owned</div>
        <div><strong>Status:</strong> Draft</div>
      </div>

    </div>

  </div>
</div>

</body>
</html>
